name: NK card Daily Run

on:
  schedule:
    # 每天 UTC 时间 22:00 运行一次 (北京/东京时间上午 6:00/7:00) 
    # 可以根据你查卡的需求自定义 cron 表达式
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许你随时在 GitHub 网页上点按钮手动运行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 action 将最新的 state.json 提交回仓库

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # PaddleOCR 在 3.10 运行极佳

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_CHAT_ID: ${{ secrets.CHANNEL_CHAT_ID }}
        run: |
          python botnkocr-new-1.py

      - name: Commit state.json back to Repo
        # 这一步非常关键：它会把机器人更新的 start_points 保存回你的代码库，明天再跑就不会重复发图了
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update scanner state.json"
          file_pattern: 'state.json'
